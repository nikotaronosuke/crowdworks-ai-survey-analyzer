<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      Content-Security-Policy の meta タグはここには書かない。
      dev サーバー（Vite の HMR / モジュール変換）が動かなくなるため、
      vite.config.ts の inject-csp プラグインが build 時にだけ <head> 先頭へ差し込む。
      => 開発中は緩く、配布する成果物は connect-src 'none' で完全にネットワーク遮断。
    -->
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="CrowdWorks 生成AI仕事アンケートの回答を、ブラウザ内だけで集計・可視化・エクスポートするツール。回答データは外部へ送信されません。"
    />

    <title>CrowdWorks 生成AIアンケート集計ツール</title>

    <!--
      外部フォント・外部スクリプト・CDN は一切読み込まない（完全ローカル動作のため）。
      配色とフォントスタックはすべて src/style.css 内で完結させている。
    -->
    <link rel="stylesheet" href="/src/style.css" />
  </head>

  <body>
    <noscript>
      <div class="noscript-notice">
        <h1>JavaScript を有効にしてください</h1>
        <p>
          このツールは、読み込んだアンケート回答を<strong>すべてブラウザ内で</strong>集計します。
          その処理に JavaScript を使うため、無効のままでは動作しません。
        </p>
        <p>
          ご利用中のブラウザで JavaScript を有効にしてから、ページを再読み込みしてください。
          回答データが外部のサーバーへ送信されることはありません。
        </p>
      </div>
    </noscript>

    <!-- アプリ本体のマウント先。描画はすべて src/ui/app.ts が行う -->
    <div id="app"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
